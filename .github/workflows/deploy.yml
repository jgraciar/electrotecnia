name: Publicar laboratorio con CircuitJS integrado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar laboratorio y CircuitJS
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener laboratorio
        uses: actions/checkout@v4
        with:
          path: laboratorio

      - name: Preparar Node.js para pruebas del laboratorio
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar sintaxis y cálculo del vatímetro
        run: |
          node --check laboratorio/bridge.js
          node --check laboratorio/wulflemm-xml.js
          node --check laboratorio/wulflemm-ui.js
          node --check laboratorio/impedance-export.js
          node laboratorio/tests/wattmeter-average.test.js
          node laboratorio/tests/wulflemm-structure.test.js
          node laboratorio/tests/wulflemm-xml-diagnostics.test.js
          node laboratorio/tests/aron-power.test.js
          node laboratorio/tests/wulflemm-xml-roundtrip.test.js
          node laboratorio/tests/bridge-import-inspection.test.js
          node laboratorio/tests/wulflemm-ui-deferred.test.js
          node --experimental-strip-types laboratorio/tests/lab-power-measurement.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-nonlinear-load.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-filtered-bridge.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-harmonics.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-robustness.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-filtered-bridge-power.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-power-factor-rectifier.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-filtered-bridge-convergence.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-grid-balance.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-inverter.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-catalog-inverter.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-current-display.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-kirchhoff.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-capacitor-bank.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-capacitor-controller.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-regulator-integration.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-commercial-installations.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-sector-autoconsumption.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-three-phase-unbalanced.test.mjs
          node laboratorio/tests/check-pv-fixture-junctions.mjs
          node --experimental-strip-types laboratorio/tests/lab-pv-capacitor-contactors.test.mjs
          node --experimental-strip-types laboratorio/tests/lab-impedance.test.mjs

      - name: Obtener código oficial de CircuitJS
        uses: actions/checkout@v4
        with:
          repository: pfalstad/circuitjs1
          ref: master
          path: circuitjs-src

      - name: Verificar componentes TypeScript del motor
        run: |
          set -eu
          for class in WattmeterTrueElm WattmeterElm CircuitXMLDeserializer CircuitXMLSerializer; do
            test -f "circuitjs-src/ts/$class.ts" || { echo "::error::Falta $class.ts"; exit 1; }
          done

      - name: Incorporar circuito original de Aron al código de CircuitJS
        run: |
          node laboratorio/scripts/embed-default-aron.mjs circuitjs-src/ts/CirSim.ts laboratorio/tests/fixtures/sistema-iii-n-startup.xml

      - name: Ampliar vatimetro con potencias P, Q1 y S
        run: |
          node laboratorio/scripts/patch-wattmeter-powers.mjs circuitjs-src/ts/WattmeterTrueElm.ts laboratorio/scripts/LabPowerMeasurement.ts

      - name: Registrar impedancia Z para corriente alterna
        run: |
          node laboratorio/scripts/patch-impedance.mjs circuitjs-src/ts laboratorio/scripts/ImpedanceElm.ts laboratorio/scripts/LabImpedance.ts

      - name: Registrar inversor fotovoltaico de corriente sincronizada
        run: |
          node laboratorio/scripts/patch-pv-inverter.mjs circuitjs-src/ts laboratorio/scripts/PVInverterElm.ts laboratorio/scripts/LabPVInverter.ts

      - name: Instalar dependencias y compilar CircuitJS
        working-directory: circuitjs-src/ts
        run: |
          npm ci
          npm run build

      - name: Confirmar vatímetro ampliado en el JavaScript compilado
        working-directory: circuitjs-src/ts
        run: |
          grep -R -l --include='*.js' 'Tipo de corriente' dist >/dev/null || { echo '::error::El vatímetro ampliado no está en la compilación'; exit 1; }
          grep -R -l --include='*.js' 'Potencia reactiva Q (VAr)' dist >/dev/null || { echo '::error::Falta la magnitud Q en el motor compilado'; exit 1; }
          grep -R -l --include='*.js' 'Impedancia Z' dist >/dev/null || { echo '::error::Falta impedancia Z (CA) en el motor compilado'; exit 1; }
          grep -R -l --include='*.js' 'FilteredBridgeElm' dist >/dev/null || { echo '::error::Falta la clase del puente rectificador filtrado en la compilación'; exit 1; }
          grep -R -l --include='*.js' 'Carga no lineal: puente rectificador con filtro C' dist >/dev/null || { echo '::error::Falta el menú de la carga no lineal en la compilación'; exit 1; }

      - name: Preparar sitio estático de GitHub Pages
        run: |
          mkdir -p public/circuitjs
          cp laboratorio/index.html laboratorio/styles.css laboratorio/initial-settings.js laboratorio/app.js laboratorio/lab-circuits.js laboratorio/bridge.js laboratorio/wulflemm-xml.js laboratorio/wulflemm-ui.js laboratorio/impedance-export.js laboratorio/sce-practices.js laboratorio/curriculum.js laboratorio/networks-solar-curriculum.js laboratorio/networks-solar-practices.js laboratorio/practices.js laboratorio/publications-data.js laboratorio/paraninfo-activities.js laboratorio/textbook-exercises.js laboratorio/textbook-curriculum.js laboratorio/textbook-ui.js laboratorio/publications.js laboratorio/LICENSE public/
          mkdir -p public/tests/fixtures
          cp laboratorio/tests/fixtures/wulflemm-aron.xml public/tests/fixtures/
          cp laboratorio/tests/fixtures/autoconsumo-*-vatimetros.xml public/tests/fixtures/
          cp -a laboratorio/tests/fixtures/autoconsumo-casos public/tests/fixtures/
          cp -a circuitjs-src/ts/dist/. public/circuitjs/
          cp circuitjs-src/COPYING.txt public/circuitjs/COPYING.txt
          test -f public/index.html
          test -f public/initial-settings.js
          test -f public/practices.js
          test -f public/publications-data.js
          test -f public/paraninfo-activities.js
          test -f public/textbook-exercises.js
          test -f public/textbook-curriculum.js
          test -f public/textbook-ui.js
          test -f public/publications.js
          test -f public/lab-circuits.js
          test -f public/impedance-export.js
          test -f public/sce-practices.js
          test -f public/curriculum.js
          test -f public/networks-solar-curriculum.js
          test -f public/networks-solar-practices.js
          test -f public/circuitjs/circuitjs.html
          test -f public/circuitjs/index.html || test -f public/circuitjs/circuitjs.html

      - name: Instalar navegador para prueba eléctrica real
        working-directory: laboratorio/tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Abrir CircuitJS, medir Aron e importar Wulflemm y Falstad
        run: |
          python3 -m http.server 8765 --directory public >/tmp/lab-http.log 2>&1 &
          sleep 2
          node laboratorio/tests/verify-impedance.mjs
          node laboratorio/tests/verify-filtered-bridge.mjs
          node laboratorio/tests/verify-pv-inverter.mjs
          node laboratorio/tests/verify-pv-inverter-modes.mjs
          node laboratorio/tests/verify-pv-unconnected.mjs
          node --experimental-strip-types laboratorio/tests/verify-pv-three-phase-unbalanced.mjs
          node laboratorio/tests/verify-pv-commercial-delta-bank.mjs
          node laboratorio/tests/verify-pv-commercial-single-phase.mjs
          node laboratorio/tests/verify-pv-visual-gallery.mjs
          node laboratorio/tests/verify-pv-capacitor-switches.mjs
          node laboratorio/tests/verify-wattmeter-inbound.mjs

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Adjuntar sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: pages
        uses: actions/deploy-pages@v4
